<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#0b0b12" rx="12" />

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f4f5">JavaScript Event Loop Workflow</text>

  <!-- Call Stack -->
  <rect x="40" y="80" width="220" height="120" rx="10" fill="#18181f" stroke="#7c3aed" stroke-width="2" />
  <text x="150" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#f4f4f5">Call Stack</text>
  <text x="150" y="135" text-anchor="middle" font-size="12" fill="#a1a1aa">Executes synchronous</text>
  <text x="150" y="152" text-anchor="middle" font-size="12" fill="#a1a1aa">code, one frame at a time</text>
  <rect x="60" y="165" width="180" height="16" rx="3" fill="#27272f" />
  <rect x="70" y="167" width="90" height="12" rx="2" fill="#7c3aed" opacity="0.6" />

  <!-- Web APIs -->
  <rect x="340" y="60" width="220" height="100" rx="10" fill="#18181f" stroke="#38bdf8" stroke-width="2" />
  <text x="450" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#f4f4f5">Web APIs</text>
  <text x="450" y="113" text-anchor="middle" font-size="12" fill="#a1a1aa">setTimeout, fetch,</text>
  <text x="450" y="130" text-anchor="middle" font-size="12" fill="#a1a1aa">DOM events run here</text>

  <!-- Microtask Queue -->
  <rect x="640" y="60" width="220" height="90" rx="10" fill="#18181f" stroke="#34d399" stroke-width="2" />
  <text x="750" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#f4f4f5">Microtask Queue</text>
  <text x="750" y="110" text-anchor="middle" font-size="12" fill="#a1a1aa">Promise callbacks</text>
  <text x="750" y="127" text-anchor="middle" font-size="12" fill="#a1a1aa">(higher priority)</text>

  <!-- Macrotask Queue -->
  <rect x="640" y="180" width="220" height="90" rx="10" fill="#18181f" stroke="#fbbf24" stroke-width="2" />
  <text x="750" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#f4f4f5">Macrotask Queue</text>
  <text x="750" y="230" text-anchor="middle" font-size="12" fill="#a1a1aa">setTimeout, setInterval,</text>
  <text x="750" y="247" text-anchor="middle" font-size="12" fill="#a1a1aa">DOM event callbacks</text>

  <!-- Event Loop -->
  <circle cx="450" cy="330" r="70" fill="#18181f" stroke="#7c3aed" stroke-width="2.5" />
  <text x="450" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#f4f4f5">Event</text>
  <text x="450" y="342" text-anchor="middle" font-size="16" font-weight="700" fill="#f4f4f5">Loop</text>
  <path d="M 405 300 A 55 55 0 1 1 400 360" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" opacity="0.55" />

  <!-- Arrows -->
  <path d="M260 130 L335 115" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />
  <text x="290" y="105" text-anchor="middle" font-size="11" fill="#a1a1aa">async call starts</text>

  <path d="M560 100 L635 100" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M560 135 Q600 200 635 220" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <path d="M700 150 Q560 280 505 305" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M700 270 Q580 330 522 335" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" />

  <path d="M410 275 Q250 240 155 205" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="270" y="255" text-anchor="middle" font-size="11" fill="#a1a1aa">pushes callback when stack is empty</text>

  <!-- Legend -->
  <text x="450" y="490" text-anchor="middle" font-size="13" fill="#a1a1aa">Call Stack → Web APIs → Queues → Event Loop → Call Stack</text>
</svg>
